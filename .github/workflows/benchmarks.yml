name: Storage Benchmarks

permissions:
  contents:write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'  # Adjust version as needed
          
      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Start Hardhat node and run benchmarks
        run: |
          # Start hardhat node in background
          npx hardhat node &
          
          # Wait for node to be ready
          sleep 10
          
          # Run deployment script
          npx hardhat run scripts/deployStorageOrderBook.js
          
          # Run benchmark script
          npx hardhat run scripts/benchmarkStorageMargin.js
          
          # Kill the background hardhat node process
          kill $(lsof -t -i:8545) || true

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Update benchmark results" || echo "No changes to commit"
          git push